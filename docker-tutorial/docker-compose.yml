services:
  web:
    build: .
    ports:
      - 8080:8080
    environment:
      DB_HOST: db
    depends_on:
      - db
    volumes:
      - .:/app
    command: go run main.go

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
volumes:
  db-data: